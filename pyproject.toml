[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "ids-xgboost-cross-domain"
version = "0.4.0"
description = "Reproducible XGBoost cross-domain intrusion detection experiments"
requires-python = ">=3.10"
dependencies = ["numpy>=1.26,<3", "pandas>=2,<3", "scikit-learn>=1.4,<2", "xgboost>=2,<4", "joblib>=1.3,<2"]

[project.optional-dependencies]
test = ["pytest>=8,<9"]
hybrid = ["torch>=2.2,<3"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]

[project.scripts]
ids-xgb = "ids_xgb.cli:main"

[tool.setuptools.packages.find]
where = ["src"]
